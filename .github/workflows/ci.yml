name: Validate Scienfactory
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run check
      - run: bun x playwright install --with-deps chromium
      - run: bun run test:e2e
  scientific-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run lab:build
      - run: bun run lab:mathlib
      - run: bun run lab:research
      - run: bun run test:lab
      - run: bun run test:files
      - run: bun run test:latex
      - run: bun run test:science
      - run: bun run test:study-precision
